services:
  redis:
    image: redis:7-alpine
    container_name: redis-container
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - bido-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api-gateway:
    build:
      context: ../api-gateway
    container_name: api-gateway-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - AUTH_SERVICE_URL=http://auth-container:8081
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_HOST=redis-container
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - bido-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  postgres-db:
    image: postgres:18
    container_name: postgres-db-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    networks:
      - bido-network
    volumes:
      - ../bido-resources/database:/docker-entrypoint-initdb.d
    restart: unless-stopped

  auth:
    build:
      context: ../auth
    container_name: auth-container
    expose:
      - "8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db-container:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - bido-network
    restart: unless-stopped
    depends_on:
      - postgres-db

networks:
  bido-network:

volumes:
  redis-data:
